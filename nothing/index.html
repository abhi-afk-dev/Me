<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <meta name="theme-color" content="#000000" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefers = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          var theme = saved || prefers;
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#000000" : "#fbfbfa");
        } catch (e) {}
      })();
    </script>

    <!-- <link rel="preload" as="image" href="/dazai_again.gif" /> -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --mask: url("/dazai_again.gif");
        --mask-size: 25vmax;
      }
      html[data-theme="dark"] {
        --bg: #000000;
        --panel: #0b0b0b;
        --ink: #ebebe9;
        --ink2: #b8b8b4;
        --muted: #8a8a85;
        --line: rgba(235, 235, 233, 0.13);
        --app-dot: rgba(235, 235, 233, 0.16);
      }
      html[data-theme="light"] {
        --bg: #fbfbfa;
        --panel: #ffffff;
        --ink: #111110;
        --ink2: #3c3c3a;
        --muted: #6e6e6a;
        --line: rgba(17, 17, 16, 0.13);
        --app-dot: rgba(17, 17, 16, 0.14);
      }

      html {
        overflow-x: clip;
      }
      body {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 72px 24px 32px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        transition:
          background-color 0.8s cubic-bezier(0.65, 0, 0.35, 1),
          color 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* Dot grid background */
      .dot-grid {
        position: absolute;
        inset: 0;
        z-index: -10;
        pointer-events: none;
        background-image: radial-gradient(
          var(--app-dot) 1.55px,
          transparent 1.5px
        );
        background-size: 28px 28px;
        background-position: center top;
        -webkit-mask-image: linear-gradient(
          to bottom,
          black 40%,
          transparent 100%
        );
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }

      /* Back link + theme toggle */
      .back {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 50;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink2);
        text-decoration: none;
        transition: color 0.25s;
      }
      .back:hover {
        color: var(--ink);
      }
      #theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink2);
        cursor: pointer;
        transition:
          transform 0.25s,
          color 0.25s;
      }
      #theme-toggle:hover {
        transform: translateY(-1px);
        color: var(--ink);
      }
      #theme-toggle:focus-visible,
      .back:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      html[data-theme="light"] .moon-icon {
        display: none;
      }
      html[data-theme="dark"] .sun-icon {
        display: none;
      }
      @media (min-width: 640px) {
        .back {
          top: 28px;
          left: 28px;
        }
        #theme-toggle {
          top: 24px;
          right: 24px;
          width: 42px;
          height: 42px;
        }
      }

      /* Game layout */
      .wrap {
        width: 100%;
        max-width: 440px;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 2.4rem;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .sub {
        margin-top: 4px;
        font-size: 15px;
        color: var(--muted);
      }
      .stats {
        display: flex;
        gap: 18px;
        margin: 16px 0 10px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
      }
      .stats b {
        color: var(--ink);
        font-weight: 600;
      }
      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
        cursor: pointer;
        font-size: 15px;
        color: var(--ink2);
        background: color-mix(in srgb, var(--panel) 78%, transparent);
        transition: opacity 0.25s;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay strong {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 2rem;
        line-height: 1.1;
        color: var(--ink);
      }
      .hint {
        margin-top: 12px;
        font-size: 13.5px;
        color: var(--muted);
      }

      /* Theme switch: character falls, bounces, dances, then zooms */
      ::view-transition-group(root) {
        z-index: 100;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: theme-drop-zoom 2.6s linear both;
        mix-blend-mode: normal;
      }
      ::view-transition-new(root) {
        -webkit-mask: var(--mask) 50% calc(var(--mask-size) * -1.2) /
          var(--mask-size) no-repeat;
        mask: var(--mask) 50% calc(var(--mask-size) * -1.2) / var(--mask-size)
          no-repeat;
      }
      @keyframes theme-drop-zoom {
        0% {
          -webkit-mask-position: 50% calc(var(--mask-size) * -1.2);
          mask-position: 50% calc(var(--mask-size) * -1.2);
          -webkit-mask-size: var(--mask-size);
          mask-size: var(--mask-size);
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        22% {
          -webkit-mask-position: 50% 50%;
          mask-position: 50% 50%;
          -webkit-mask-size: var(--mask-size);
          mask-size: var(--mask-size);
          animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1);
        }
        29% {
          -webkit-mask-position: 50% 42%;
          mask-position: 50% 42%;
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        35% {
          -webkit-mask-position: 50% 50%;
          mask-position: 50% 50%;
        }
        84% {
          -webkit-mask-position: 50% 50%;
          mask-position: 50% 50%;
          -webkit-mask-size: var(--mask-size);
          mask-size: var(--mask-size);
          animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
        }
        100% {
          -webkit-mask-position: 50% 50%;
          mask-position: 50% 50%;
          -webkit-mask-size: 750vmax;
          mask-size: 750vmax;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }
        ::view-transition-new(root) {
          -webkit-mask: none;
          mask: none;
        }
      }
    </style>
  </head>

  <body>
    <div aria-hidden="true" class="dot-grid"></div>

    <a class="back" href="/index.html">&larr; back</a>

    <button id="theme-toggle" type="button" aria-label="Toggle theme">
      <svg
        class="sun-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
      <svg
        class="moon-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <main class="wrap">
      <h1>Snake</h1>
      <p class="sub">oh really, what did you expect?</p>

      <div class="stats">
        <span>score <b id="score">0</b></span>
        <span>best <b id="best">0</b></span>
      </div>

      <div class="board">
        <canvas id="c" aria-label="Snake game board"></canvas>
        <div id="overlay" role="button" tabindex="0">
          <strong id="ov-title">Snake</strong>
          <span id="ov-sub">press space or tap to start</span>
        </div>
      </div>

      <p class="hint">
        arrow keys / wasd &middot; swipe on mobile &middot; space to pause
      </p>
    </main>

    <script>
      // ── Theme toggle (same behaviour as the homepage) ──
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      let busy = false;

      function setTheme(next) {
        root.setAttribute("data-theme", next);
        metaTheme.setAttribute(
          "content",
          next === "dark" ? "#000000" : "#fbfbfa",
        );
        try {
          localStorage.setItem("theme", next);
        } catch (e) {}
      }

      // Mask failsafe: fall back to a circle if the GIF can't load as a CSS mask
      (function () {
        const m = getComputedStyle(root)
          .getPropertyValue("--mask")
          .match(/url\((['"]?)(.*?)\1\)/);
        if (!m) return;
        fetch(m[2])
          .then((r) => {
            if (!r.ok) throw new Error(r.status);
          })
          .catch(() => {
            const circle =
              "data:image/svg+xml," +
              encodeURIComponent(
                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50'/></svg>",
              );
            root.style.setProperty("--mask", 'url("' + circle + '")');
          });
      })();

      btn.addEventListener("click", () => {
        if (busy) return;
        const next =
          root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!document.startViewTransition || reduce) {
          setTheme(next);
          return;
        }
        busy = true;
        const t = document.startViewTransition(() => setTheme(next));
        t.finished.finally(() => (busy = false));
      });

      // ── Snake ──
      const N = 18; // grid is N x N cells
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const ovTitle = document.getElementById("ov-title");
      const ovSub = document.getElementById("ov-sub");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      let size = 0;
      let cell = 0;
      let snake, dir, queue, food, score, state, timer;
      // state: "idle" | "run" | "paused" | "over"

      let best = 0;
      try {
        best = parseInt(localStorage.getItem("snake-best") || "0", 10) || 0;
      } catch (e) {}
      bestEl.textContent = best;

      function resize() {
        size = canvas.parentElement.clientWidth;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cell = size / N;
        draw();
      }

      function reset() {
        const mid = Math.floor(N / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid },
        ];
        dir = { x: 1, y: 0 };
        queue = [];
        score = 0;
        scoreEl.textContent = 0;
        placeFood();
      }

      function placeFood() {
        const free = [];
        for (let x = 0; x < N; x++)
          for (let y = 0; y < N; y++)
            if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
        food = free.length
          ? free[Math.floor(Math.random() * free.length)]
          : null;
      }

      function showOverlay(title, sub) {
        ovTitle.textContent = title;
        ovSub.textContent = sub;
        overlay.classList.remove("hidden");
      }

      function start() {
        if (state === "over" || state === "idle" || !snake) reset();
        state = "run";
        overlay.classList.add("hidden");
        schedule();
      }

      function pause() {
        if (state !== "run") return;
        state = "paused";
        clearTimeout(timer);
        showOverlay("Paused", "press space or tap to resume");
      }

      function gameOver() {
        state = "over";
        clearTimeout(timer);
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          try {
            localStorage.setItem("snake-best", String(best));
          } catch (e) {}
        }
        showOverlay("Game over", "score " + score + " · space or tap to retry");
      }

      function schedule() {
        clearTimeout(timer);
        const delay = Math.max(60, 130 - score * 3);
        timer = setTimeout(tick, delay);
      }

      function tick() {
        if (state !== "run") return;

        if (queue.length) {
          const d = queue.shift();
          // ignore a 180° reversal
          if (d.x !== -dir.x || d.y !== -dir.y) dir = d;
        }

        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
        const willEat = food && head.x === food.x && head.y === food.y;
        // the tail moves away this tick unless we're eating
        const body = willEat ? snake : snake.slice(0, -1);
        const hitSelf = body.some((s) => s.x === head.x && s.y === head.y);

        if (hitWall || hitSelf) {
          draw();
          gameOver();
          return;
        }

        snake.unshift(head);
        if (willEat) {
          score++;
          scoreEl.textContent = score;
          placeFood();
        } else {
          snake.pop();
        }

        draw();
        schedule();
      }

      function turn(x, y) {
        if (state === "idle" || state === "over") start();
        else if (state === "paused") start();
        const last = queue.length ? queue[queue.length - 1] : dir;
        if (x === last.x && y === last.y) return;
        if (queue.length < 2) queue.push({ x, y });
      }

      function color(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
      }

      function draw() {
        if (!ctx || !cell) return;
        const ink = color("--ink");
        const dot = color("--app-dot");
        ctx.clearRect(0, 0, size, size);

        // faint dot grid, echoing the page background
        ctx.fillStyle = dot;
        for (let x = 0; x < N; x++) {
          for (let y = 0; y < N; y++) {
            ctx.beginPath();
            ctx.arc((x + 0.5) * cell, (y + 0.5) * cell, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (!snake) return;

        // food: a ring
        if (food) {
          ctx.strokeStyle = ink;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(
            (food.x + 0.5) * cell,
            (food.y + 0.5) * cell,
            cell * 0.28,
            0,
            Math.PI * 2,
          );
          ctx.stroke();
        }

        // snake: rounded squares, head solid, body fading toward the tail
        const pad = cell * 0.1;
        snake.forEach((s, i) => {
          const a = i === 0 ? 1 : Math.max(0.28, 1 - i / (snake.length + 4));
          ctx.globalAlpha = a;
          ctx.fillStyle = ink;
          roundRect(
            s.x * cell + pad,
            s.y * cell + pad,
            cell - pad * 2,
            cell - pad * 2,
            cell * 0.22,
          );
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function toggleRun() {
        if (state === "run") pause();
        else start();
      }

      // Keyboard
      const KEYS = {
        ArrowUp: [0, -1],
        w: [0, -1],
        W: [0, -1],
        ArrowDown: [0, 1],
        s: [0, 1],
        S: [0, 1],
        ArrowLeft: [-1, 0],
        a: [-1, 0],
        A: [-1, 0],
        ArrowRight: [1, 0],
        d: [1, 0],
        D: [1, 0],
      };
      window.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key in KEYS) {
          e.preventDefault();
          turn(KEYS[e.key][0], KEYS[e.key][1]);
        } else if (e.key === " " || e.key === "Enter") {
          if (document.activeElement === btn) return;
          e.preventDefault();
          toggleRun();
        } else if (e.key === "p" || e.key === "P") {
          pause();
        }
      });

      // Touch: swipe to steer, tap to start/pause
      let tx = 0,
        ty = 0;
      canvas.addEventListener(
        "touchstart",
        (e) => {
          tx = e.touches[0].clientX;
          ty = e.touches[0].clientY;
        },
        { passive: true },
      );
      canvas.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - tx;
        const dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) {
          toggleRun();
          return;
        }
        if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
        else turn(0, dy > 0 ? 1 : -1);
      });

      overlay.addEventListener("click", toggleRun);

      // Redraw when the theme changes, and when the viewport changes
      new MutationObserver(draw).observe(root, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
      window.addEventListener("resize", resize);

      // Auto-pause if the tab is hidden
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pause();
      });

      state = "idle";
      reset();
      resize();
    </script>
  </body>
</html>
