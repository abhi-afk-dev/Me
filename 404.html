<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Void</title>
    <meta name="theme-color" content="#000000" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefers = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var theme = saved || prefers;
          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#000000" : "#fbfbfa");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        originalWarn(...args);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>console.warn = originalWarn;</script>

    <script>
      tailwind.config = {
        darkMode: ["selector", '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Instrument Serif"', "Georgia", "serif"],
              sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      html[data-theme="dark"] { --app-dot: rgba(235, 235, 233, 0.16); }
      html[data-theme="light"] { --app-dot: rgba(17, 17, 16, 0.14); }
      
      .dot-grid {
        background-image: radial-gradient(var(--app-dot) 1.55px, transparent 1.5px);
        background-size: 28px 28px;
        background-position: center top;
        -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }

      body {
        transition: background-color 0.8s cubic-bezier(0.65, 0, 0.35, 1), color 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }

      html[data-theme="light"] .moon-icon { display: none; }
      html[data-theme="dark"] .sun-icon { display: none; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: none; }
      }
      .rise { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    </style>
  </head>

  <body class="relative min-h-screen min-h-svh flex flex-col bg-[#fbfbfa] dark:bg-black text-[#111110] dark:text-[#ebebe9] font-sans selection:bg-black/10 dark:selection:bg-white/15 items-center justify-center px-6">
    <div aria-hidden="true" class="dot-grid absolute inset-0 -z-10 pointer-events-none"></div>

    <button id="theme-toggle" type="button" aria-label="Toggle theme" class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50 flex h-[38px] w-[38px] sm:h-[42px] sm:w-[42px] items-center justify-center rounded-full border border-black/10 dark:border-white/10 bg-white dark:bg-[#0b0b0b] text-[#3c3c3a] dark:text-[#b8b8b4] transition hover:-translate-y-px hover:text-black dark:hover:text-white">
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <main class="rise flex flex-col items-center text-center max-w-[500px]">
      <h1 class="font-serif italic font-normal text-[5rem] sm:text-[7rem] leading-none tracking-[-0.03em] mb-4">404</h1>
      <p class="text-[16px] text-[#6e6e6a] dark:text-[#8a8a85] mb-8 leading-relaxed">
        You've wandered into the void. This room of chaos doesn't exist.
      </p>
      <a href="/" class="prose-link text-[15px]">Return to the surface</a>
    </main>

    <style type="text/tailwindcss">
      .prose-link {
        @apply font-medium text-[#111110] dark:text-[#ebebe9] underline underline-offset-[3px] decoration-[1.5px] decoration-black/15 dark:decoration-white/15 hover:decoration-current transition;
      }
    </style>

    <script>
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");
      const metaTheme = document.querySelector('meta[name="theme-color"]');

      btn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        metaTheme.setAttribute("content", next === "dark" ? "#000000" : "#fbfbfa");
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    </script>
  </body>
</html>
